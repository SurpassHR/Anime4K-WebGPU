<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anime4K WebGPU Color Test</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0b0d12; color: #e8eaf0; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header, main { max-width: 1000px; margin: 0 auto; padding: 18px 22px; }
    header { padding-bottom: 0; }
    h1 { font-size: 16px; margin: 0 0 6px; }
    p { color: #9aa7c2; margin: 6px 0; }
    .wrap { position: relative; width: 640px; max-width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    canvas { pointer-events: none; visibility: hidden; }
    button { margin: 12px 8px 0 0; padding: 7px 12px; border-radius: 7px; border: 1px solid #33405e; background: #182038; color: #e8eaf0; cursor: pointer; }
    button.primary { background: #4b6cff; border-color: #4b6cff; }
    pre { background: #121725; border: 1px solid #222b40; border-radius: 8px; padding: 12px; overflow: auto; font-size: 11px; color: #b9c4dc; }
    code { background: #141a2a; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Anime4K WebGPU Color Test</h1>
    <p>SMPTE 彩条 · 2× anime4k · 逐点比较源视频与输出。理想情况：每个通道误差 ≤ 2/255。</p>
    <p><strong>必须通过 HTTP 打开：</strong>在仓库根目录运行 <code>npm run dev</code>，然后访问 <code>http://127.0.0.1:8765/demo/color-test.html</code>。直接双击 <code>file://</code> 打开时，浏览器会因 canvas taint 禁止 <code>getImageData</code>。</p>
  </header>
  <main>
    <div class="wrap"><video id="v" src="color.mp4" muted loop playsinline></video><canvas id="c"></canvas></div>
    <button id="run" class="primary">运行颜色测试</button>
    <button id="restore">1× Restore 模式</button>
    <p>如果输出平均亮度明显高于源视频，通常是 sRGB/线性空间被重复转换，或 `importExternalTexture` 的色彩空间没有处理对。</p>
    <pre id="log">等待运行…</pre>
  </main>
  <script type="module" src="../src/demo/color-test.ts"></script>
</body>
</html>
